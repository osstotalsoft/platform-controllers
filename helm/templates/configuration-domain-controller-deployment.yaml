apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuration-domain-controller
  labels:
    app: configuration-domain-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configuration-domain-controller
  template:
    metadata:
      annotations:
        {{- if .Values.global.rusi.enabled }}
        rusi.io/app-id: ConfigurationDomain.Controller
        rusi.io/enabled: "true"
        {{- end }}
      labels:
        app: configuration-domain-controller
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.global.tag }}
        app.kubernetes.io/managed-by: "helm"
        {{- if and .Values.global.azure.enabled .Values.global.azure.useWorkloadIdentity }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      containers:
      - name: configuration-domain-controller
        image: "{{ .Values.global.registry }}/platform-controllers:{{ .Values.global.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VAULT_ENABLED
          value: {{ .Values.global.vault.enabled | quote }}
        {{- if .Values.global.vault.enabled }}
        - name: VAULT_ADDR
          value: "{{ .Values.global.vault.address }}"
        {{- end }}
        - name: RUSI_ENABLED
          value: "{{ .Values.global.rusi.enabled }}"
        - name: AZURE_ENABLED
          value: {{ .Values.global.azure.enabled | quote }}
        {{- if .Values.global.azure.enabled }}
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: azure-config
              key: tenantId
        {{- if not .Values.global.azure.useWorkloadIdentity }}
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: azure-config
              key: clientId
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: azure-secret
              key: clientSecret
        {{- end }}
        {{- end }}
        command:
        - "/configuration-domain-controller"
        args:
        - "--v"
        - "{{ .Values.global.logLevel }}"
      serviceAccountName: configuration-domain-controller
{{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
{{- end }}