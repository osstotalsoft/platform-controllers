---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: domains.platform.totalsoft.ro
spec:
  group: platform.totalsoft.ro
  names:
    kind: Domain
    listKind: DomainList
    plural: domains
    singular: domain
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              dependsOn:
                description: |-
                  DependsOn lists the domains that must be provisioned before this one, for the same tenant.
                  A tenant's stack for this domain is provisioned only after the tenant's stack of every listed domain
                  has had at least one successful update. Domains the tenant doesn't have are ignored, and platform-level
                  provisioning ignores DependsOn.
                items:
                  description: DomainDependency references a domain that a Domain
                    depends on.
                  properties:
                    domain:
                      description: Domain is the name of a Domain on the same platform.
                      type: string
                  required:
                  - domain
                  type: object
                type: array
              exportActiveDomains:
                type: boolean
              platformRef:
                description: PlatformRef is the target platform.
                type: string
              url:
                description: |-
                  Url of the domain's application. A template rendered with the tenant context,
                  e.g. "https://{{ .Tenant.Code }}.example.com/app". Required when VisibleInPortal is true.
                type: string
              visibleInPortal:
                default: false
                description: VisibleInPortal shows the domain in the portal, linking
                  to Url.
                type: boolean
            required:
            - platformRef
            type: object
            x-kubernetes-validations:
            - message: url is required when visibleInPortal is true
              rule: '!has(self.visibleInPortal) || !self.visibleInPortal || (has(self.url)
                && self.url != '''')'
        required:
        - spec
        type: object
    served: true
    storage: true
